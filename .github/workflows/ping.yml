name: Daily Supabase Ping

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "https://ostajdhuaxrjrwroayja.supabase.co/functions/v1/ping" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"