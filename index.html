<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fioxify – Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0a0b0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fioxify" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
  <script defer src="app.js"></script>
</head>
<body class="auth-body">
  <script>
    // Gira prima che il browser dipinga: se non c'è una sessione salvata si
    // toglie subito il loader e si va dritti al form, senza farlo lampeggiare.
    // Con una sessione salvata il loader resta e copre il redirect alla libreria.
    (function () {
      try {
        var hasSession = Object.keys(localStorage).some(function (k) {
          return k.indexOf("sb-") === 0 && k.indexOf("-auth-token") !== -1;
        });
        if (!hasSession) document.documentElement.classList.add("no-stored-session");
      } catch (e) {
        // localStorage non disponibile (private browsing, storage bloccato):
        // meglio mostrare il login che restare su un loader eterno
        document.documentElement.classList.add("no-stored-session");
      }
    })();
  </script>

  <div id="app-loader" class="app-loader">
    <div class="app-loader-inner">
      <div class="app-loader-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
          <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>
        </svg>
      </div>
      <div class="app-loader-bars" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <p class="app-loader-text">Fioxify</p>
    </div>
  </div>

  <div class="auth-container">
    <h1 class="logo">Fioxify</h1>

    <div id="auth-tabs" class="auth-tabs">
      <button id="tab-login" class="auth-tab active">Accedi</button>
      <button id="tab-register" class="auth-tab">Registrati</button>
    </div>

    <form id="login-form" class="auth-form active">
      <input type="email" id="login-email" placeholder="Email" autocomplete="username" />
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
      <label class="auth-checkbox-row">
        <input type="checkbox" id="login-remember" />
        <span>Ricorda la mia email</span>
      </label>
      <button id="login-btn" type="submit">Entra</button>
      <button id="forgot-password-link" class="auth-link" type="button">Password dimenticata?</button>
      <p class="auth-error" id="login-error"></p>
    </form>

    <form id="register-form" class="auth-form">
      <input type="email" id="register-email" placeholder="Email" autocomplete="username" />
      <input type="password" id="register-password" placeholder="Password" autocomplete="new-password" />
      <input type="password" id="register-password-confirm" placeholder="Conferma password" autocomplete="new-password" />
      <button id="register-btn" type="submit">Crea account</button>
      <p class="auth-hint">Dopo la registrazione un amministratore dovrà approvare il tuo account prima che tu possa accedere.</p>
      <p class="auth-error" id="register-error"></p>
    </form>

    <form id="forgot-form" class="auth-form">
      <p class="auth-hint">Inserisci la tua email: ti invieremo un link per impostare una nuova password.</p>
      <input type="email" id="forgot-email" placeholder="Email" autocomplete="username" />
      <button id="forgot-btn" type="submit">Invia link di recupero</button>
      <button id="back-to-login-link" class="auth-link" type="button">Torna al login</button>
      <p class="auth-error" id="forgot-error"></p>
    </form>

    <p class="app-version" id="app-version"></p>
  </div>

  <div id="toast-container" class="toast-container"></div>
</body>
</html>
