<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fioxify – Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0a0b0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fioxify" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
  <script defer src="app.js"></script>
</head>
<body class="auth-body">
  <div class="auth-container">
    <h1 class="logo">Fioxify</h1>

    <div id="auth-tabs" class="auth-tabs">
      <button id="tab-login" class="auth-tab active">Accedi</button>
      <button id="tab-register" class="auth-tab">Registrati</button>
    </div>

    <div id="login-form" class="auth-form active">
      <input type="email" id="login-email" placeholder="Email" autocomplete="username" />
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
      <label class="auth-checkbox-row">
        <input type="checkbox" id="login-remember" />
        <span>Ricorda la mia email</span>
      </label>
      <button id="login-btn">Entra</button>
      <button id="forgot-password-link" class="auth-link" type="button">Password dimenticata?</button>
      <p class="auth-error" id="login-error"></p>
    </div>

    <div id="register-form" class="auth-form">
      <input type="email" id="register-email" placeholder="Email" autocomplete="username" />
      <input type="password" id="register-password" placeholder="Password" autocomplete="new-password" />
      <input type="password" id="register-password-confirm" placeholder="Conferma password" autocomplete="new-password" />
      <button id="register-btn">Crea account</button>
      <p class="auth-hint">Dopo la registrazione un amministratore dovrà approvare il tuo account prima che tu possa accedere.</p>
      <p class="auth-error" id="register-error"></p>
    </div>

    <div id="forgot-form" class="auth-form">
      <p class="auth-hint">Inserisci la tua email: ti invieremo un link per impostare una nuova password.</p>
      <input type="email" id="forgot-email" placeholder="Email" autocomplete="username" />
      <button id="forgot-btn">Invia link di recupero</button>
      <button id="back-to-login-link" class="auth-link" type="button">Torna al login</button>
      <p class="auth-error" id="forgot-error"></p>
    </div>

    <p class="app-version" id="app-version"></p>
  </div>

  <div id="toast-container" class="toast-container"></div>
</body>
</html>
