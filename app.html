<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fioxify – Libreria</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#050608" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>

  <script defer src="app.js"></script>
</head>

<body class="app-body">

  <!-- HEADER -->
  <header class="app-header">
    <div class="user-info">
      <span id="user-email"></span>
    </div>
    <button id="logout-btn" class="logout-btn">Logout</button>
  </header>

  <!-- NAVIGAZIONE PRIMARIA -->
  <nav class="app-nav">
    <button class="nav-tab active" data-page="library">📚 Libreria</button>
    <button class="nav-tab" data-page="upload">⬆️ Carica</button>
  </nav>

  <main class="app-main">

    <!-- PAGINA LIBRERIA -->
    <section id="page-library" class="app-page active">
      <div class="library-section">
        <div class="library-inner">

          <div class="view-tabs">
            <button class="view-tab active" data-view="library">Libreria</button>
            <button class="view-tab" data-view="favorites">Preferiti</button>
            <button class="view-tab" data-view="history">Cronologia</button>
            <button class="view-tab" data-view="artists">Artisti</button>
            <button class="view-tab" data-view="albums">Album</button>
            <button class="view-tab" data-view="playlists">Playlist</button>
          </div>

          <div class="filters-row">
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Cerca per titolo, artista o tag..."
            />
            <select id="sort-select" class="sort-select">
              <option value="date">Aggiunta di recente</option>
              <option value="title">Titolo (A-Z)</option>
              <option value="artist">Artista (A-Z)</option>
              <option value="plays">Più ascoltati</option>
            </select>
          </div>

          <div id="playlists-panel" class="playlists-panel">
            <div class="new-playlist-row">
              <input type="text" id="new-playlist-name" placeholder="Nome nuova playlist" />
              <button id="new-playlist-btn" class="btn-primary">Crea</button>
            </div>
            <ul id="playlists-list" class="playlists-list"></ul>
          </div>

          <div id="groups-panel" class="playlists-panel">
            <ul id="groups-list" class="playlists-list"></ul>
          </div>

          <p id="empty-message"></p>
          <ul id="tracks-list" class="tracks-list"></ul>
        </div>
      </div>
    </section>

    <!-- PAGINA CARICA -->
    <section id="page-upload" class="app-page">
      <div class="upload-section">
        <h2 class="page-title">Carica un brano</h2>
        <div class="upload-inner">
          <input type="file" id="file-input" accept="audio/*" />

          <!-- TAG SYSTEM UPLOAD -->
          <div class="tags-box">
            <div id="tags-container" class="tags-container"></div>
            <input
              type="text"
              id="tag-input"
              class="tag-input"
              placeholder="Aggiungi tag e premi Invio"
            />
          </div>

          <button id="upload-btn" class="btn-primary">Carica</button>
          <p id="upload-status"></p>
        </div>
      </div>
    </section>

  </main>

  <p class="app-version" id="app-version"></p>

  <!-- MINI PLAYER (persistente, tocca per aprire la vista estesa) -->
  <div id="mini-player" class="mini-player" hidden>
    <img id="mini-cover" class="mini-player-cover" alt="Cover" />
    <div class="mini-player-info">
      <span id="mini-track-name" class="mini-player-title"></span>
      <span id="mini-track-artist" class="mini-player-artist"></span>
    </div>
    <button id="mini-play-pause-btn" class="mini-play-btn" title="Play">▶</button>
  </div>

  <!-- PLAYER ESTESO (a schermo intero, come il "Now Playing" di Spotify) -->
  <div id="full-player" class="full-player-overlay" hidden>
    <button id="collapse-player-btn" class="collapse-player-btn" title="Chiudi">⌄ In riproduzione</button>

    <section class="player-section">
      <div class="current-track">
        <div id="cover-wrap" class="cover-wrap">
          <img
            id="current-cover"
            class="track-cover"
            alt="Cover"
          />
          <button id="like-current-btn" class="cover-like-btn" title="Preferito">🤍</button>
          <div class="cover-equalizer" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
        <h3 id="current-track-name">Nessun brano in riproduzione</h3>
        <p id="current-track-artist" class="current-track-artist"></p>
      </div>

      <div class="progress-row">
        <span id="current-time" class="time-label">0:00</span>
        <input type="range" id="seek-bar" class="seek-bar" min="0" max="0" value="0" step="0.1" />
        <span id="duration-time" class="time-label">0:00</span>
      </div>

      <div class="player-controls-row">
        <button id="shuffle-btn" class="control-btn" title="Shuffle">🔀</button>
        <button id="prev-btn" class="control-btn" title="Precedente">⏮</button>
        <button id="play-pause-btn" class="control-btn control-btn-primary" title="Play">▶</button>
        <button id="next-btn" class="control-btn" title="Successivo">⏭</button>
        <button id="repeat-btn" class="control-btn" title="Ripeti">🔁</button>
      </div>
    </section>
  </div>

  <audio id="audio-player" preload="metadata"></audio>

  <div id="toast-container" class="toast-container"></div>

  <!-- MODALE CONFERMA ELIMINAZIONE (richiede di scrivere "elimina") -->
  <div id="confirm-modal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h3 id="confirm-modal-title">Conferma eliminazione</h3>
      <p id="confirm-modal-message"></p>
      <input
        type="text"
        id="confirm-modal-input"
        class="confirm-modal-input"
        placeholder='Scrivi "elimina" per confermare'
        autocomplete="off"
      />
      <div class="modal-actions">
        <button id="confirm-modal-cancel" class="modal-btn-secondary">Annulla</button>
        <button id="confirm-modal-confirm" class="modal-btn-danger" disabled>Elimina definitivamente</button>
      </div>
    </div>
  </div>

</body>
</html>
