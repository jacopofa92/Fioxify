<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Fioxify – Libreria</title>
  <link rel="stylesheet" href="css/style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body class="app-body">

  <!-- HEADER -->
  <header class="app-header">
    <div class="user-info">
      <span id="user-email"></span>
    </div>
    <button id="logout-btn" class="logout-btn">Logout</button>
  </header>

  <main class="app-layout">

    <!-- SEZIONE UPLOAD -->
    <section class="upload-section">
      <h2>Carica un brano</h2>
      <input type="file" id="file-input" accept="audio/*" />
      <button id="upload-btn">Carica</button>
      <p id="upload-status"></p>
    </section>

    <!-- SEZIONE PLAYER -->
    <section class="player-section">
      <div class="current-track">
        <img id="current-cover" class="track-cover" src="img/default-cover.png" alt="Cover" />
        <h3 id="current-track-name">Nessun brano in riproduzione</h3>
      </div>

      <audio id="audio-player" controls></audio>
    </section>

    <!-- SEZIONE LIBRERIA -->
    <section class="library-section">
      <h2>Libreria</h2>
      <p id="empty-message"></p>

      <ul id="tracks-list" class="tracks-list">
        <!-- I brani verranno inseriti qui -->
      </ul>
    </section>

  </main>

</body>

</html>
