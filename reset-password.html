<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fioxify – Nuova password</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#0a0b0f" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
  <script defer src="app.js"></script>
</head>
<body class="auth-body">
  <div class="auth-container">
    <h1 class="logo">Fioxify</h1>

    <div id="reset-password-form" class="auth-form active">
      <p class="auth-hint" id="reset-password-hint">Verifica del link di recupero in corso...</p>
      <input type="password" id="reset-password-new" placeholder="Nuova password" autocomplete="new-password" disabled />
      <input type="password" id="reset-password-confirm" placeholder="Conferma nuova password" autocomplete="new-password" disabled />
      <button id="reset-password-btn" disabled>Imposta nuova password</button>
      <button id="reset-password-back-link" class="auth-link" type="button">Torna al login</button>
      <p class="auth-error" id="reset-password-error"></p>
    </div>

    <p class="app-version" id="app-version"></p>
  </div>

  <div id="toast-container" class="toast-container"></div>
</body>
</html>
